<html lang="en">
  <head>
    <meta charset="utf-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#070807" />
    <meta
      name="description"
      content="Satyan Thayaparan — developer portfolio with a Spotify-inspired now-playing experience."
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Satyan Thayaparan — Portfolio</title>
    <script>
      (function () {
        try {
          var now = new Date();
          var start = new Date(now.getFullYear(), 0, 0);
          var day = Math.floor((now - start) / 86400000);
          var decl = 23.44 * Math.sin(((2 * Math.PI) / 365) * (day - 81));
          var lat = (45.4215 * Math.PI) / 180;
          var declRad = (decl * Math.PI) / 180;
          var ha = Math.acos(Math.min(1, Math.max(-1, -Math.tan(lat) * Math.tan(declRad))));
          var daylight = (2 * ((ha * 180) / Math.PI)) / 15;
          var sunrise = 12.2 - daylight / 2;
          var sunset = 12.2 + daylight / 2;
          var hour = now.getHours() + now.getMinutes() / 60;
          document.documentElement.dataset.theme =
            hour >= sunrise && hour < sunset ? "morning" : "night";
        } catch (e) {
          document.documentElement.dataset.theme = "night";
        }
      })();
    </script>
